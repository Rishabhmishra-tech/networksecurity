          
name: workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  id-token: write
  contents: read

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"

# ----------------------------------------------------------------------
# This is the corrected job using docker/login-action and
# docker/build-push-action for a robust CI/CD pipeline.
# ----------------------------------------------------------------------
  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. Configure AWS Credentials using the access key and secret.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 2. Set up Buildx (required for the build-push action).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # 3. Log into ECR using the credentials configured above.
      - name: Log in to Amazon ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AWS_ECR_LOGIN_URI }}
          username: AWS
          password: ${{ steps.login-ecr.outputs.password }}
      
      # 4. Build, tag, and push the image in a single, reliable step.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:${{ github.sha }}
          # Use the latest tag for easier deployment reference
          # tags: ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest

