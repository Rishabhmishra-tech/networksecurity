name: workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  id-token: write
  contents: read

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Updated to v4

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"

  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Updated to v4

      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4 # Updated to v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2 # Updated to v2

      # --- START: FIX FOR DOCKER BUILD ERROR ---

      # 1. Set up Docker Buildx for modern building capabilities
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # 2. Use the official action to reliably build and push
      - name: Build and push Docker image to Amazon ECR
        uses: docker/build-push-action@v5
        with:
          context: . # Uses the current directory as the build context
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest
          # Add provenance: false to prevent potential ECR push conflicts
          provenance: false

      # 3. Manually set the image URI as an output for any downstream steps
      - name: Set output image tag
        id: build-image # Retains the original ID for compatibility
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest"
          # Use the modern way to set output variables
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT 
          
      # --- END: FIX FOR DOCKER BUILD ERROR ---