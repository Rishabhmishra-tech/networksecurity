name: workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  id-token: write
  contents: read

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"

  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        # NOTE: Your old screenshot showed @v1, but your new file is @v2. Keep @v2.
        uses: aws-actions/amazon-ecr-login@v2 

      # The following steps replace your faulty 'run: docker build...' block

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build and push Docker image to Amazon ECR
        id: build-image # Keep this ID for potential downstream steps
        uses: docker/build-push-action@v5
        with:
          context: . 
          push: true
          # The full image URI is used here for tagging ECR
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest
          # This line prevents potential ECR manifest/metadata conflicts
          provenance: false
          # Output the image URI for any other deployment steps
          outputs: "type=registry,long=true,push=true" 

      # NOTE: The previous separate 'Set output image tag' step is no longer needed
      # because the 'docker/build-push-action' automatically handles the image output.