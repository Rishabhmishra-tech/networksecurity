build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2 # Recommended to use v2

      # --- Docker/Buildx Setup ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Build, Tag, and Push to ECR (FIXED STEP) ---
      # This step uses the official action to fix the 'invalid reference format' error
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@v5
        with:
          # This is the context argument that was missing from your manual command
          context: .
          # Pushes the image after a successful build
          push: true
          # Tags the image with the full, correct ECR path
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest
          # Optional: Enable ECR Layer Caching for faster builds
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME }}:buildcache,mode=max

      # --- Output the Image Name (Corrected Indentation) ---
      - name: Set output image tag
        id: set-output-image
        run: |
          IMAGE_TAG=latest 
          echo "::set-output name=image::${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME }}:$IMAGE_TAG"